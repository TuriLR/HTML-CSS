<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <!--Direções
    {
        row:para direita;
        row-reverse: da direita para esquerda;
        column:Empilhado de cima para baixo;
        column-reverse: Empilhado de baixo para cima;
        }

        Eixos-row
    {
        main-axis: da esquerda para direita;
        cross-axis: de cima para baixo;
        }
        Eixos-row-reverse
    {
        main-axis:da direita para esquerda;
        cross-axis: de baixo para cima;
        }
        Eixos-column
    {
        main-axis: De cima para baixo de forma vertical;
        cross-axis: Da esquerda para direita;
        }
        Eixos-column-reverse
    {
        main-axis: De baixo para cima de forma vertical;
        cross-axis: da direita para a esquerda;
        }
        Wrap
    {
        wrap:Quebra o bloco no sentido do cross-axis;
        wrap-reverse: QUebra a linha no sentido contrario ao cross-axis;
        }
    --><style>
        div.conteiner{
            background-color: salmon;
            display: flex;
            flex-flow: row wrap-reverse;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
