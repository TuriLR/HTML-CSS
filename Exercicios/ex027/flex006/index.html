<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <!-- Aling-content{
     ALinha os elementos no eixo transversal quando estão empacotados;
     }
     Stretch{
     Padrão;
     }
     Flex-Start{
     Vai por todos os elementos no cross-start;
     }
     Flex-end{
     Vai por todos os elementos no cross-;
     }
     Center{
     Vai por no centro;
     }
     Space-between{
     Vai por no cross-start e no cross-end deixando um espaço no meio para ser preenchido com outros itens;
     }
     Space-evenly{
     Cria espaçamentos com espaços milimetricamente calculados no topo e na parte de baixo e também no meio;
     }
     Space-aroud{
     Basicamente o stretch mas ele não vai espichar os elementos e sim por no centro;
     }
     }
     -->
     <style>
     div.conteiner{
            background-color: salmon;
            height: 400px;
            display: flex;
            flex-flow: row wrap;
            align-content: space-around;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
        <div class="item">K</div>
        <div class="item">L</div>
        <div class="item">M</div>
</body>
</head>
