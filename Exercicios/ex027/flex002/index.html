<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <!--Direções
    {
        row:para direita;
        row-reverse: da direita para esquerda;
        column:Empilhado de cima para baixo;
        column-reverse: Empilhado de baixo para cima;
        }

        Eixos-row
    {
        main-axis: da esquerda para direita;
        cross-axis: de cima para baixo;
        }
        Eixos-row-reverse
    {
        main-axis:da direita para esquerda;
        cross-axis: de baixo para cima;
        }
        Eixos-column
    {
        main-axis: De cima para baixo de forma vertical;
        cross-axis: Da esquerda para direita;
        }

    {
        main-axis: De baixo para cima de forma vertical;
        cross-axis: da direita para a esquerda;
        }
    --><style>
        div.conteiner{
            background-color: salmon;
            display: flex;
            flex-direction: column;

            padding: 10px;
        }

</head>

    <div class="conteiner">
        <div class="item">A</div>
